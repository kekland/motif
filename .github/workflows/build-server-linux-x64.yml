name: Build server (Linux-x64)

on:
  push:
    tags:
      - 'server-v*'
      - 'v*'
  workflow_dispatch:

jobs:
   build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - id: version
        run: |
          VERSION=${GITHUB_REF_NAME#server-}
          echo "name=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Native toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config

      - uses: subosito/flutter-action@v2
        with:
          channel: master

      - name: Build
        working-directory: sync/sync_server
        run: |
          flutter pub get
          dart build cli --target bin/main.dart --output build/linux_x64

      - name: Package
        run: tar -czf server-${{ steps.version.outputs.name }}-linux-x64.tar.gz -C sync/sync_server/build linux_x64

      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ steps.version.outputs.name }}-linux-x64
          path: server-*.tar.gz
