name: Deploy app to GitHub Pages

on:
  push:
    tags:
      - '*'
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: master
      - uses: bluefireteam/flutter-gh-pages@v9
        with:
          workingDir: app
          baseHref: /motif/
          compileToWasm: true
          customArgs: --dart-define="SERVER_URL=https://motif.kz" --dart-define="ENV=external" --build-name=${{ github.ref_name }} --build-number=${{ github.run_number }}