include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    curly_braces_in_flow_control_structures: ignore
    no_leading_underscores_for_local_identifiers: ignore
    unused_element_parameter: ignore

  exclude:
    - __archive__/**
    - packages/skia/build/**
    - vendor/stack_assets/lib/src/templates/base_icon.dart

formatter:
  page_width: 120
  trailing_commas: preserve
