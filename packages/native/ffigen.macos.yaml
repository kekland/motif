name: MacosNativeBindings
description: FFI bindings for macOS native APIs.
language: objc
output:
  bindings: lib/src/gen/macos_bindings.g.dart
  objc-bindings: darwin/native/Sources/native_macos_bindings/dart_bindings.g.m

ffi-native:
  asset-id: 'macos_bindings'

exclude-all-by-default: true

preamble: |
  // Generated file, do not edit.
  // Generated by ffigen (ffigen.macos.yaml)
  //
  // ignore_for_file: camel_case_types, non_constant_identifier_names, unused_element, unused_field, void_checks, annotate_overrides, no_leading_underscores_for_local_identifiers, library_private_types_in_public_api

headers:
  entry-points:
    - 'build/ffigen/macos/*.h'
    - $MACOS_SDK/System/Library/Frameworks/AppKit.framework/Headers/NSApplication.h
    - $MACOS_SDK/System/Library/Frameworks/AppKit.framework/Headers/NSWindow.h
    - $MACOS_SDK/System/Library/Frameworks/AppKit.framework/Headers/NSButton.h
    - $MACOS_SDK/System/Library/Frameworks/AppKit.framework/Headers/NSView.h
    - $MACOS_SDK/System/Library/Frameworks/AppKit.framework/Headers/NSWindowStyleMask.h
    - $MACOS_SDK/System/Library/Frameworks/AppKit.framework/Headers/NSNotificationCenter.h
    - $MACOS_SDK/System/Library/Frameworks/AppKit.framework/Headers/NSLayoutConstraint.h
    - $MACOS_SDK/System/Library/Frameworks/AppKit.framework/Headers/NSLayoutAnchor.h
    - $MACOS_SDK/System/Library/Frameworks/AppKit.framework/Headers/NSTitlebarAccessoryViewController.h
    - $MACOS_SDK/System/Library/Frameworks/AppKit.framework/Headers/NSCursor.h
    - $MACOS_SDK/System/Library/Frameworks/AppKit.framework/Headers/NSImage.h
    - $MACOS_SDK/System/Library/Frameworks/AppKit.framework/Headers/NSImageRep.h
    - $MACOS_SDK/System/Library/Frameworks/AppKit.framework/Headers/NSBitmapImageRep.h
    - $MACOS_SDK/System/Library/Frameworks/AppKit.framework/Headers/NSHapticFeedback.h

globals:
  include:
    - NSWindowWillEnterFullScreenNotification
    - NSWindowWillExitFullScreenNotification
    - NSWindowDidResizeNotification
    - NSWindowStyleMaskFullScreen
  
objc-interfaces:
  include:
    # Common AppKit classes
    - NSApplication
    - NSWindow
    - NSButton
    - NSView
    - NSImage
    - NSImageRep
    - NSBitmapImageRep

    # Titlebar
    - NSLayoutConstraint
    - NSLayoutXAxisAnchor
    - NSLayoutYAxisAnchor
    - NSTitlebarAccessoryViewController
    
    # Cursor
    - NSCursor

    # Haptics
    - NSHapticFeedbackManager

objc-protocols:
  include:
    - NSHapticFeedbackPerformer

objc-categories:
  rename:
    'Deprecated': 'NSImageDeprecated'
