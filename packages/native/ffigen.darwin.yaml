name: DarwinNativeBindings
description: FFI bindings for shared iOS/macOS native APIs.
language: objc
output:
  bindings: lib/src/gen/darwin_bindings.g.dart
  objc-bindings: darwin/native/Sources/native_darwin_bindings/dart_bindings.g.m

ffi-native:
  asset-id: 'darwin_bindings'

exclude-all-by-default: true

preamble: |
  // Generated file, do not edit.
  // Generated by ffigen (ffigen.darwin.yaml)
  //
  // ignore_for_file: camel_case_types, non_constant_identifier_names, unused_element, unused_field, void_checks, annotate_overrides, no_leading_underscores_for_local_identifiers, library_private_types_in_public_api

headers:
  entry-points:
    - 'build/ffigen/darwin/*.h'

objc-interfaces:
  include:
    - NotificationCenterListener

  module:
    'NotificationCenterListener': 'native_darwin'