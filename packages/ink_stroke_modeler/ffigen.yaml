name: InkStrokeModelerBindings
description: Bindings for Google's ink-stroke-modeler library.
language: c
output: 
  bindings: 'lib/src/bindings.g.dart'

ffi-native:
  asset-id: 'package:ink_stroke_modeler/ink_stroke_modeler.dart'

compiler-opts:
  - '-Ibuild/include'

headers:
  entry-points:
    - 'src/ink_stroke_modeler.h'

functions:
  symbol-address:
    include:
      - .*_destroy

preamble: |
  // ignore_for_file: camel_case_types, non_constant_identifier_names, unused_element, unused_field, return_of_invalid_type, void_checks, annotate_overrides, no_leading_underscores_for_local_identifiers, library_private_types_in_public_api
