name: DawnNativeBindings
description: Bindings for Dawn API.
language: c
output: 
  bindings: 'lib/src/gen/webgpu_native_bindings.dart'

ffi-native:
  asset-id: 'package:dawn/src/asset.dart'

compiler-opts:
  - '-Iinclude'

headers:
  entry-points:
    - 'src/dawn.h'
    - 'include/webgpu/webgpu.h'

functions:
  symbol-address:
    include:
      - .*Release

preamble: |
  // ignore_for_file: camel_case_types, non_constant_identifier_names, unused_element, unused_field, return_of_invalid_type, void_checks, annotate_overrides, no_leading_underscores_for_local_identifiers, library_private_types_in_public_api
