name: webgpu
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  web: ^1.1.1
  ffi: ^2.2.0
  meta: ^1.19.0
  hooks: ^2.2.0
  code_assets: ^2.1.0
  native_toolchain_c: ^0.19.0

dev_dependencies:
  ffigen: ^23.0.0
  js_interop_gen:
    git:
      url: https://github.com/dart-lang/web
      path: js_interop_gen
      ref: main

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: WebGpuPluginIos
        sharedDarwinSource: true
        ffiPlugin: true
      macos:
        pluginClass: WebGpuPluginMacOS
        sharedDarwinSource: true
        ffiPlugin: true