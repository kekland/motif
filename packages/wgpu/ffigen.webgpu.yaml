name: WebGPUBindings
description: Bindings for WebGPU C API.
language: c
output: 
  bindings: 'lib/src/webgpu/bindings.g.dart'

ffi-native:
  asset-id: 'package:wgpu/src/asset.dart'

compiler-opts:
  - '-Ibuild/include'

headers:
  entry-points:
    - 'build/include/webgpu.h'

functions:
  symbol-address:
    include:
      - .*Release

preamble: |
  // ignore_for_file: camel_case_types, non_constant_identifier_names, unused_element, unused_field, return_of_invalid_type, void_checks, annotate_overrides, no_leading_underscores_for_local_identifiers, library_private_types_in_public_api
