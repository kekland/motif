name: wgpu
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  ffi: ^2.2.0
  hooks: ^2.2.0
  code_assets: ^1.1.0
  native_toolchain_c: ^0.19.0
  vector_math: ^2.2.0

dev_dependencies:
  ffigen: ^21.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: WGPUPluginIos
        sharedDarwinSource: true
        ffiPlugin: true
      macos:
        pluginClass: WGPUPluginMacOS
        sharedDarwinSource: true
        ffiPlugin: true