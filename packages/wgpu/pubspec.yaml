name: wgpu
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  ffi: ^2.2.0
  hooks: ^1.0.3
  code_assets: ^1.0.0
  native_toolchain_c: ^0.17.4

dev_dependencies:
  ffigen: ^20.1.1

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: WGPUPluginIos
        sharedDarwinSource: true
        ffiPlugin: true
      macos:
        pluginClass: WGPUPluginMacOS
        sharedDarwinSource: true
        ffiPlugin: true