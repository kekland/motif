syntax = "proto3";

package motif;

import "core/asset/asset.proto";
import "packages/blueprint/blueprint.proto";

// ---------------------------------------------------------------------------------------------------------------------
// Program, statements, ids, etc
// ---------------------------------------------------------------------------------------------------------------------

message Program {
  repeated Statement statements     = 1;
  StyleTable         style          = 2;
  AssetManifest      asset_manifest = 3;
  ProgramSettings    settings       = 4;
}

message ProgramSlice {
  repeated Statement statements = 1;
  StyleTable         style      = 2;
}

message Statement {
  StatementId     id        = 1;
  ModifierStack   modifiers = 2;
  optional string name      = 3;

  oneof value {
    VertexStatement         vertex          = 10;
    EdgeStatement           edge            = 11;
    FaceStatement           face            = 12;
    CutEdgeStatement        cut_edge        = 13;
    MultiCutEdgeStatement   multi_cut_edge  = 14;
    FilletFaceStatement     fillet_face     = 15;
    GlueVerticesStatement   glue_vertices   = 16;
    RectangleStatement      rectangle       = 17;
    PolygonStatement        polygon         = 18;
    EllipseStatement        ellipse         = 19;
    ContainerStatement      container       = 20;
    GroupStatement          group           = 21;
    GeneratorStatement      generator       = 22;
    TextStatement           text            = 23;
    ReorderStatement        reorder         = 24;
    PrefabOriginStatement   prefab_origin   = 25;
    PrefabInstanceStatement prefab_instance = 26;
  }
}

message U64 {
  uint32 hi = 1;
  uint32 lo = 2;
}

message StatementId {
  U64 value = 1;
}

enum CellKind {
  CELL_KIND_FRAME  = 0;
  CELL_KIND_VERTEX = 1;
  CELL_KIND_EDGE   = 2;
  CELL_KIND_FACE   = 3;
}

message CellRef {
  U64      namespace = 1;
  uint32   tag       = 2;
  uint32   sub       = 3;
  CellKind kind      = 4;
}

message ProgramSettings {
  ColorData background_color = 1;
  string    title            = 2;
}

// ---------------------------------------------------------------------------------------------------------------------
// Z-order
// ---------------------------------------------------------------------------------------------------------------------

enum ZPlacement {
  Z_PLACEMENT_TOP    = 0;
  Z_PLACEMENT_BOTTOM = 1;
  Z_PLACEMENT_ABOVE  = 2;
  Z_PLACEMENT_BELOW  = 3;
}

message ZAnchor {
  oneof value {
    int32   top    = 1;
    int32   bottom = 2;
    CellRef above  = 3;
    CellRef below  = 4;
  }
}

// ---------------------------------------------------------------------------------------------------------------------
// Style
// ---------------------------------------------------------------------------------------------------------------------

message StyleEntry {
  CellRef           ref   = 1;
  CellStyle.Partial value = 2;
}

message StyleTable {
  repeated StyleEntry entries = 1;
}

message CellStyle {
  message Partial {
    oneof value {
      VertexStyle.Partial vertex = 1;
      EdgeStyle.Partial   edge   = 2;
      FaceStyle.Partial   face   = 3;
    }
  }

  oneof value {
    VertexStyle vertex = 1;
    EdgeStyle   edge   = 2;
    FaceStyle   face   = 3;
  }
}

message VertexStyle {
  message Partial {
    optional double      radius      = 1;
    optional Decorations decorations = 2;
  }

  double      radius      = 1;
  Decorations decorations = 2;
}

message EdgeStyle {
  message Partial {
    optional double      width       = 1;
    optional Decorations decorations = 2;
  }

  double      width       = 1;
  Decorations decorations = 2;
}

message FaceStyle {
  message Partial {
    optional Decorations decorations = 1;
  }

  Decorations decorations = 1;
}

message Decoration {
  message Color {
    ColorData value = 1;
  }

  message Image {
    optional string value = 1;
  }

  oneof kind {
    Color color = 1;
    Image image = 2;
  }
}

message Decorations {
  repeated Decoration entries = 1;
}

// ---------------------------------------------------------------------------------------------------------------------
// Selectors
// ---------------------------------------------------------------------------------------------------------------------

message CellSelector {
  CellRef ref = 1;
}

message ChainSelector {
  repeated CellRef edges = 1;
}

message FragmentSelector {
  StatementId    id            = 1;
  optional int32 modifierIndex = 2;
}

message ParentSelector {
  CellRef ref = 1;
}

message Selector {
  oneof value {
    CellSelector     cell     = 1;
    ParentSelector   parent   = 2;
    ChainSelector    chain    = 3;
    FragmentSelector fragment = 4;
  }
}

message SingleSelector {
  oneof value {
    CellSelector cell = 1;
  }
}

// ---------------------------------------------------------------------------------------------------------------------
// Statements
// ---------------------------------------------------------------------------------------------------------------------

message FrameStatement {
  Mat4             transform = 1;
  optional Size2   size      = 2;
  optional CellRef parent    = 3;
}

message VertexStatement {
  Vec2             position = 1;
  VertexStyle      style    = 2;
  optional CellRef parent   = 3;
}

message EdgeStatement {
  SingleSelector   start         = 1;
  SingleSelector   end           = 2;
  optional Vec2    start_tangent = 3;
  optional Vec2    end_tangent   = 4;
  EdgeStyle        style         = 5;
  optional CellRef parent        = 6;
}

message FaceStatement {
  ChainSelector          outer  = 1;
  repeated ChainSelector holes  = 2;
  FaceStyle              style  = 3;
  optional CellRef       parent = 4;
}

message CutEdgeStatement {
  SingleSelector target = 1;
  double         t      = 2;
}

message MultiCutEdgeStatement {
  SingleSelector  target = 1;
  repeated double ts     = 2;
}

message FilletFaceStatement {
  SingleSelector        face    = 1;
  CornerRadii           corners = 2;
  optional CornerRadius radius  = 3;
}

message GlueVerticesStatement {
  enum Position {
    GLUE_VERTICES_STATEMENT_POSITION_FIRST    = 0;
    GLUE_VERTICES_STATEMENT_POSITION_CENTROID = 1;
  }

  repeated SingleSelector vertices = 1;
  Position                position = 2;
}

message RectangleStatement {
  LayoutSize            size         = 1;
  Mat4                  transform    = 2;
  ObjectShape.Rectangle shape        = 3;
  VertexStyle           vertex_style = 4;
  EdgeStyle             edge_style   = 5;
  FaceStyle             face_style   = 6;
  optional CellRef      parent       = 7;
}

message PolygonStatement {
  LayoutSize          size         = 1;
  Mat4                transform    = 2;
  ObjectShape.Polygon shape        = 3;
  VertexStyle         vertex_style = 4;
  EdgeStyle           edge_style   = 5;
  FaceStyle           face_style   = 6;
  optional CellRef    parent       = 7;
}

message EllipseStatement {
  LayoutSize          size         = 1;
  Mat4                transform    = 2;
  ObjectShape.Ellipse shape        = 3;
  VertexStyle         vertex_style = 4;
  EdgeStyle           edge_style   = 5;
  FaceStyle           face_style   = 6;
  optional CellRef    parent       = 7;
}

message ContainerStatement {
  Layout           layout       = 1;
  LayoutSize       size         = 2;
  Mat4             transform    = 3;
  ObjectShape      shape        = 4;
  VertexStyle      vertex_style = 5;
  EdgeStyle        edge_style   = 6;
  FaceStyle        face_style   = 7;
  optional CellRef parent       = 8;
}

message GroupStatement {
  optional CellRef parent = 1;
}

message GeneratorStatement {
  Generator                 generator = 1;
  repeated FragmentSelector inputs    = 2;
  optional CellRef          parent    = 3;
  Mat4                      transform = 4;
}

message TextStatement {
  string           text             = 1;
  LayoutSize       size             = 2;
  Mat4             transform        = 3;
  optional CellRef parent           = 4;
  TextFormat       text_format      = 6;
  ParagraphFormat  paragraph_format = 5;
  VertexStyle      vertex_style     = 7;
  EdgeStyle        edge_style       = 8;
  FaceStyle        face_style       = 9;
}

message ReorderStatement {
  CellSelector          target    = 1;
  ZPlacement            placement = 2;
  optional int32        rank      = 3;
  optional CellSelector sibling   = 4;
}

message PrefabOriginStatement {
  Layout           layout       = 1;
  LayoutSize       size         = 2;
  Mat4             transform    = 3;
  ObjectShape      shape        = 4;
  VertexStyle      vertex_style = 5;
  EdgeStyle        edge_style   = 6;
  FaceStyle        face_style   = 7;
  optional CellRef parent       = 8;
}

message PrefabInstanceStatement {
  message Override {
    StatementId      id      = 1;
    StatementPartial partial = 2;
  }

  StatementId          prefab_id    = 1;
  optional Layout      layout       = 2;
  optional LayoutSize  size         = 3;
  Mat4                 transform    = 4;
  optional ObjectShape shape        = 5;
  optional VertexStyle vertex_style = 6;
  optional EdgeStyle   edge_style   = 7;
  optional FaceStyle   face_style   = 8;
  optional CellRef     parent       = 9;
  GeneratorOverrides   overrides    = 10;
}

message StatementPartial {
  message Value {
    oneof kind {
      ModifierStack                  modifiers              = 1;
      string                         name                   = 2;
      Mat4                           transform              = 3;
      LayoutSize                     layout_size            = 4;
      VertexStyle                    vertex_style           = 5;
      EdgeStyle                      edge_style             = 6;
      FaceStyle                      face_style             = 7;
      ObjectShape                    object_shape           = 8;
      Vec2                           position               = 9;
      string                         text                   = 10;
      TextFormat                     text_format            = 11;
      ParagraphFormat                paragraph_format       = 12;
      CornerRadii                    corners                = 13;
      CornerRadius                   radius                 = 14;
      GlueVerticesStatement.Position glue_vertices_position = 15;
      Layout                         layout                 = 16;
    }
  }

  repeated Value fields = 1;
}

message GeneratorOverrides {
  repeated GeneratorOverrideNode.Entry children = 1;
}

message GeneratorOverrideNode {
  message Entry {
    StatementId           id   = 1;
    GeneratorOverrideNode node = 2;
  }

  optional StatementPartial partial  = 1;
  repeated Entry            children = 2;
}

// ---------------------------------------------------------------------------------------------------------------------
// Shapes
// ---------------------------------------------------------------------------------------------------------------------

message ObjectShape {
  message Rectangle {}
  message Polygon { int32 sides = 1; }
  message Ellipse {}

  oneof value {
    Rectangle rectangle = 1;
    Polygon   polygon   = 2;
    Ellipse   ellipse   = 3;
  }
}

// ---------------------------------------------------------------------------------------------------------------------
// Layout
// ---------------------------------------------------------------------------------------------------------------------

message LayoutSize {
  LayoutDimension width  = 1;
  LayoutDimension height = 2;
}

message LayoutDimension {
  enum Type {
    LAYOUT_DIMENSION_TYPE_FIXED   = 0;
    LAYOUT_DIMENSION_TYPE_EXPAND  = 1;
    LAYOUT_DIMENSION_TYPE_CONTAIN = 2;
  }

  message Range {
    double min = 1;
    double max = 2;
  }

  optional double value = 1;
  Type            type  = 2;
  Range           range = 3;
}

message Layout {
  enum Align {
    LAYOUT_ALIGN_NONE   = 0;
    LAYOUT_ALIGN_START  = 1;
    LAYOUT_ALIGN_CENTER = 2;
    LAYOUT_ALIGN_END    = 3;
  }

  enum Justify {
    LAYOUT_JUSTIFY_START         = 0;
    LAYOUT_JUSTIFY_CENTER        = 1;
    LAYOUT_JUSTIFY_END           = 2;
    LAYOUT_JUSTIFY_SPACE_BETWEEN = 3;
  }

  message Insets {
    double top    = 1;
    double right  = 2;
    double bottom = 3;
    double left   = 4;
  }

  message Stack {
    optional Align align_horizontal = 1;
    optional Align align_vertical   = 2;
    Insets         padding          = 5;
  }

  message Flex {
    enum Direction {
      LAYOUT_FLEX_DIRECTION_ROW    = 0;
      LAYOUT_FLEX_DIRECTION_COLUMN = 1;
    }

    Direction direction   = 1;
    Justify   justify     = 2;
    Align     cross_align = 3;
    double    gap         = 4;
    Insets    padding     = 5;
  }

  oneof value {
    Stack stack = 1;
    Flex  flex  = 2;
  }
}

// ---------------------------------------------------------------------------------------------------------------------
// Text
// ---------------------------------------------------------------------------------------------------------------------

enum TextFontSlant {
  TEXT_FONT_SLANT_UPRIGHT = 0;
  TEXT_FONT_SLANT_ITALIC  = 1;
  TEXT_FONT_SLANT_OBLIQUE = 2;
}

enum TextFontWeight {
  TEXT_FONT_WEIGHT_THIN        = 0;
  TEXT_FONT_WEIGHT_EXTRA_LIGHT = 1;
  TEXT_FONT_WEIGHT_LIGHT       = 2;
  TEXT_FONT_WEIGHT_REGULAR     = 3;
  TEXT_FONT_WEIGHT_MEDIUM      = 4;
  TEXT_FONT_WEIGHT_SEMI_BOLD   = 5;
  TEXT_FONT_WEIGHT_BOLD        = 6;
  TEXT_FONT_WEIGHT_EXTRA_BOLD  = 7;
  TEXT_FONT_WEIGHT_BLACK       = 8;
}

enum TextFontWidth {
  TEXT_FONT_WIDTH_ULTRA_CONDENSED = 0;
  TEXT_FONT_WIDTH_EXTRA_CONDENSED = 1;
  TEXT_FONT_WIDTH_CONDENSED       = 2;
  TEXT_FONT_WIDTH_SEMI_CONDENSED  = 3;
  TEXT_FONT_WIDTH_NORMAL          = 4;
  TEXT_FONT_WIDTH_SEMI_EXPANDED   = 5;
  TEXT_FONT_WIDTH_EXPANDED        = 6;
  TEXT_FONT_WIDTH_EXTRA_EXPANDED  = 7;
  TEXT_FONT_WIDTH_ULTRA_EXPANDED  = 8;
}

enum TextDecorationKind {
  TEXT_DECORATION_KIND_UNDERLINE     = 0;
  TEXT_DECORATION_KIND_OVERLINE      = 1;
  TEXT_DECORATION_KIND_STRIKETHROUGH = 2;
}

message TextFormat {
  double                      font_size      = 1;
  double                      line_height    = 2;
  double                      letter_spacing = 3;
  string                      font_family    = 4;
  TextFontSlant               font_slant     = 5;
  TextFontWeight              font_weight    = 6;
  TextFontWidth               font_width     = 7;
  repeated TextDecorationKind decorations    = 8;
}

enum TextAlignment {
  TEXT_ALIGNMENT_LEFT    = 0;
  TEXT_ALIGNMENT_RIGHT   = 1;
  TEXT_ALIGNMENT_CENTER  = 2;
  TEXT_ALIGNMENT_JUSTIFY = 3;
}

enum TextVerticalAlignment {
  TEXT_VERTICAL_ALIGNMENT_TOP    = 0;
  TEXT_VERTICAL_ALIGNMENT_MIDDLE = 1;
  TEXT_VERTICAL_ALIGNMENT_BOTTOM = 2;
}

message ParagraphFormat {
  TextAlignment         alignment          = 1;
  TextVerticalAlignment vertical_alignment = 2;
  optional string       ellipsis           = 3;
}

// ---------------------------------------------------------------------------------------------------------------------
// Generator nodes
// ---------------------------------------------------------------------------------------------------------------------

message Generator {
  message PositionEntry {
    NodeId node     = 1;
    Vec2   position = 2;
  }

  repeated Node          nodes       = 1;
  repeated Connection    connections = 2;
  repeated PositionEntry positions   = 3;
  repeated NodeId        fixed       = 4;
}

message GeneratorSlice {
  repeated Node                    nodes       = 1;
  repeated Connection              connections = 2;
  repeated Generator.PositionEntry positions   = 3;
}

// ---------------------------------------------------------------------------------------------------------------------
// Modifiers
// ---------------------------------------------------------------------------------------------------------------------

message ModifierStack {
  repeated Modifier entries = 1;
}

message Modifier {
  oneof value {
    FilletModifier fillet = 1;
  }
}

message FilletModifier {
  message Corner {
    int32        index  = 1;
    CornerRadius radius = 2;
  }

  optional CornerRadius radius  = 1;
  repeated Corner       corners = 2;
}

// ---------------------------------------------------------------------------------------------------------------------
// Deltas/changes
// ---------------------------------------------------------------------------------------------------------------------

message ProgramDelta {
  repeated ProgramChange changes = 1;
}

message ProgramAnchor {
  oneof value {
    bool        start = 1;
    bool        end   = 2;
    StatementId at    = 3;
    StatementId after = 4;
  }
}

message StatementChange {
  ProgramAnchor      anchor   = 1;
  repeated Statement removed  = 2;
  repeated Statement inserted = 3;
}

message StyleChange {
  CellRef                    ref    = 1;
  optional CellStyle.Partial before = 2;
  optional CellStyle.Partial after  = 3;
}

message AssetChange {
  repeated motif.Asset removed  = 1;
  repeated motif.Asset inserted = 2;
}

message SettingsChange {
  ProgramSettings before = 1;
  ProgramSettings after  = 2;
}

message ProgramChange {
  oneof value {
    StatementChange statement = 1;
    StyleChange     style     = 2;
    AssetChange     asset     = 3;
    SettingsChange  settings  = 4;
    bool            empty     = 100;
  }
}

// ---------------------------------------------------------------------------------------------------------------------
// Other types
// ---------------------------------------------------------------------------------------------------------------------

message Mat4 {
  double m00 = 1; double m01 = 2; double m02 = 3; double m03 = 4;
  double m10 = 5; double m11 = 6; double m12 = 7; double m13 = 8;
  double m20 = 9; double m21 = 10; double m22 = 11; double m23 = 12;
  double m30 = 13; double m31 = 14; double m32 = 15; double m33 = 16;
}

message Vec2 {
  double x = 1;
  double y = 2;
}

message Size2 {
  double width  = 1;
  double height = 2;
}

message CornerRadii {
  map<int32, CornerRadius> corners = 1;
}

message CornerRadius {
  double x = 1;
  double y = 2;
}

message ColorData {
  message Hsv {
    double h = 1;
    double s = 2;
    double v = 3;
  }

  oneof value {
    Hsv hsv = 1;
  }

  double alpha = 5;
}

// % GENERATOR MARK

message Node {
  NodeId id = 1;

  oneof kind {
    GeneratorInput  generator_input  = 10;
    GeneratorOutput generator_output = 11;
    Array           array            = 12;
    Fillet          fillet           = 13;
    Number          number           = 14;
    Vector          vector           = 15;
    Vertices        vertices         = 16;
    RandomVector    random_vector    = 17;
    Index           index            = 18;
    ScaleVector     scale_vector     = 19;
    ConnectVertices connect_vertices = 20;
    Face            face             = 21;
    Polar           polar            = 22;
    Pi              pi               = 23;
    Divide          divide           = 24;
  }

  message GeneratorInput {
  }

  message GeneratorOutput {
  }

  message Array {
    optional ProgramSlice slice  = 1;
    optional Vec2         count  = 2;
    optional Vec2         offset = 3;
  }

  message Fillet {
    optional ProgramSlice slice  = 1;
    optional Vec2         radius = 2;
  }

  message Number {
    optional double value = 1;
  }

  message Vector {
    optional Vec2 value = 1;
  }

  message Vertices {
    optional int32 count    = 1;
    optional Vec2  position = 2;
  }

  message RandomVector {
    optional int32 seed = 1;
    optional Vec2  min  = 2;
    optional Vec2  max  = 3;
  }

  message Index {
  }

  message ScaleVector {
    optional Vec2   vector = 1;
    optional double factor = 2;
  }

  message ConnectVertices {
    optional ProgramSlice slice  = 1;
    optional bool         closed = 2;
  }

  message Face {
    optional ProgramSlice slice = 1;
  }

  message Polar {
    optional double radius = 1;
    optional double angle  = 2;
  }

  message Pi {
  }

  message Divide {
    optional double numerator   = 1;
    optional double denominator = 2;
  }
}